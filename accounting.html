<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Journal Entry Trainer — Accounting Quiz</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=IBM+Plex+Mono:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600;700;800&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --dr: #4f7c77;          /* muted teal — debit */
    --cr: #8c9f74;          /* sage — credit */
    --dr-soft: rgba(79,124,119,0.16);
    --cr-soft: rgba(140,159,116,0.20);
    --dr-line: rgba(79,124,119,0.36);
    --cr-line: rgba(140,159,116,0.42);
    --gold: #c4b28f;
    --gold-soft: rgba(196,178,143,0.22);
    --gold-line: rgba(196,178,143,0.5);
    --bad: #b96b5e;
    --bad-soft: rgba(216,180,174,0.28);
    --bad-line: rgba(185,107,94,0.4);
    --ink: #111111;
    --ink-strong: #000000;
    --mute: #374151;
    --faint: #6b7280;
    --line: rgba(17,24,39,0.12);
    --line-strong: rgba(17,24,39,0.22);
    --panel: rgba(255,255,255,0.92);
    --panel-alt: rgba(249,250,251,0.96);
    --panel-soft: rgba(17,24,39,0.035);
    --shadow-sm: 0 10px 26px rgba(15,23,42,0.06);
    --shadow-md: 0 18px 42px rgba(15,23,42,0.08);
    --font-sans: 'IBM Plex Sans','Segoe UI',sans-serif;
    --font-serif: 'Fraunces','Iowan Old Style','Palatino Linotype',serif;
    --font-mono: 'IBM Plex Mono','SFMono-Regular',monospace;
  }

  html { background: #d1d5db; }
  body {
    background: #d1d5db;
    font-family: var(--font-sans);
    color: var(--ink);
    min-height: 100vh;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: 0;
    background:
      radial-gradient(circle at 18% 10%, rgba(156,163,175,0.15) 0%, transparent 34%),
      radial-gradient(circle at 84% 14%, rgba(203,213,225,0.14) 0%, transparent 30%),
      radial-gradient(circle at 50% 115%, rgba(148,163,184,0.12) 0%, transparent 34%),
      repeating-linear-gradient(135deg, rgba(17,24,39,0.018) 0 1px, transparent 1px 24px),
      linear-gradient(180deg, #dadde3 0%, #d4d8de 42%, #d1d5db 100%);
    pointer-events: none;
  }
  body::after {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 2px;
    z-index: 100;
    background: linear-gradient(90deg, transparent 0%, rgba(107,114,128,0.5) 18%, rgba(55,65,81,0.7) 50%, rgba(107,114,128,0.5) 82%, transparent 100%);
    opacity: 0.55;
  }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes pageLift {
    0% { opacity: 0; transform: translateY(10px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  @keyframes goldPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(196,178,143,0); }
    50% { box-shadow: 0 0 12px 2px rgba(196,178,143,0.45); }
  }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25%     { transform: translateX(-4px); }
    75%     { transform: translateX(4px); }
  }

  .container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 1040px;
    margin: 0 auto;
    padding: 56px 24px 88px;
    animation: pageLift 0.45s ease-out both;
  }

  /* ─── Start screen ───────────────────────────────────────── */
  .hero { text-align: center; margin-bottom: 32px; animation: fadeIn 0.5s ease-out; }
  .hero h1 {
    font-family: var(--font-serif);
    font-size: 2.8rem;
    font-weight: 700;
    letter-spacing: -0.05em;
    line-height: 1;
    color: var(--ink-strong);
    margin-bottom: 10px;
  }
  .hero .sub {
    color: var(--faint);
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    font-weight: 600;
  }

  .start-card {
    background: linear-gradient(180deg, rgba(255,255,255,0.97), rgba(247,248,250,0.97));
    border: 1px solid var(--line);
    border-radius: 22px;
    padding: 40px 42px;
    box-shadow: var(--shadow-md);
    animation: fadeIn 0.6s ease-out;
  }
  .start-card h2 {
    font-family: var(--font-serif);
    font-size: 1.3rem;
    font-weight: 700;
    margin-bottom: 14px;
    color: var(--ink-strong);
    letter-spacing: -0.01em;
  }
  .rules {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
    margin-bottom: 28px;
    font-size: 0.86rem;
    line-height: 1.55;
    color: var(--mute);
  }
  .rules .row {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 12px 14px;
    background: var(--panel-soft);
    border: 1px solid var(--line);
    border-radius: 14px;
  }
  .rules .pill {
    flex-shrink: 0;
    font-size: 0.65rem;
    font-weight: 800;
    padding: 3px 8px;
    border-radius: 6px;
    letter-spacing: 0.08em;
    margin-top: 1px;
    font-family: var(--font-mono);
  }
  .rules .pill.dr { background: var(--dr-soft); color: var(--dr); border: 1px solid var(--dr-line); }
  .rules .pill.cr { background: var(--cr-soft); color: #5a6f49; border: 1px solid var(--cr-line); }

  .category-filter {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 28px;
  }
  .cat-chip {
    font-family: inherit;
    font-size: 0.78rem;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--mute);
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .cat-chip:hover { border-color: var(--gold-line); color: var(--ink-strong); }
  .cat-chip.active {
    background: var(--gold-soft);
    border-color: var(--gold-line);
    color: var(--ink-strong);
  }
  .timer-control {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: -8px 0 28px;
  }
  .timer-chip {
    font-family: inherit;
    font-size: 0.78rem;
    font-weight: 700;
    padding: 8px 14px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--mute);
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .timer-chip:hover { border-color: var(--line-strong); color: var(--ink-strong); }
  .timer-chip.active {
    background: var(--dr-soft);
    border-color: var(--dr-line);
    color: var(--dr);
  }

  .btn {
    font-family: inherit;
    font-weight: 800;
    font-size: 0.95rem;
    padding: 14px 28px;
    border-radius: 999px;
    border: 1px solid var(--line-strong);
    cursor: pointer;
    transition: all 0.18s ease;
    letter-spacing: 0.02em;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .btn-primary {
    background: #d1d5db;
    color: var(--ink-strong);
    width: 100%;
    justify-content: center;
    box-shadow: 0 8px 24px rgba(15,23,42,0.08);
  }
  .btn-primary:hover {
    transform: translateY(-1px);
    box-shadow: 0 12px 28px rgba(15,23,42,0.12);
    background: #c8ccd2;
  }
  .btn-ghost {
    background: var(--panel-soft);
    color: var(--ink);
    border: 1px solid var(--line);
  }
  .btn-ghost:hover { background: var(--panel); border-color: var(--line-strong); }
  .btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }

  /* ─── Quiz screen ────────────────────────────────────────── */
  .meta-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    font-size: 0.78rem;
    color: var(--faint);
    letter-spacing: 0.04em;
    font-weight: 600;
  }
  .score-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 12px;
    border-radius: 999px;
    background: var(--cr-soft);
    border: 1px solid var(--cr-line);
    color: #5a6f49;
    font-weight: 700;
  }
  .streak-pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 4px 12px;
    border-radius: 999px;
    background: var(--gold-soft);
    border: 1px solid var(--gold-line);
    color: #7a6c4e;
    font-weight: 700;
    margin-left: 8px;
  }
  .timer-pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 4px 12px;
    border-radius: 999px;
    background: var(--panel-soft);
    border: 1px solid var(--line);
    color: var(--ink);
    font-family: var(--font-mono);
    font-weight: 800;
    margin-right: 8px;
    min-width: 58px;
    justify-content: center;
  }
  .timer-pill.warning {
    background: var(--gold-soft);
    border-color: var(--gold-line);
    color: #7a6c4e;
  }
  .timer-pill.danger {
    background: var(--bad-soft);
    border-color: var(--bad-line);
    color: #7a3f37;
  }

  .progress-bar {
    height: 4px;
    background: rgba(17,24,39,0.08);
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 22px;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--dr) 0%, var(--cr) 100%);
    transition: width 0.35s ease;
  }

  .qcard {
    background: linear-gradient(180deg, rgba(255,255,255,0.97), rgba(247,248,250,0.97));
    border: 1px solid var(--line);
    border-radius: 22px;
    padding: 36px 42px;
    box-shadow: var(--shadow-md);
    animation: fadeIn 0.35s ease-out;
  }
  .cat-tag {
    display: inline-block;
    padding: 4px 12px;
    background: var(--panel-soft);
    border: 1px solid var(--line);
    border-radius: 999px;
    font-size: 0.65rem;
    font-weight: 800;
    letter-spacing: 0.16em;
    color: var(--faint);
    margin-bottom: 18px;
    text-transform: uppercase;
  }
  .q-meta {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 18px;
  }
  .q-meta .cat-tag { margin-bottom: 0; }
  .source-tag {
    display: inline-flex;
    align-items: center;
    padding: 4px 10px;
    border-radius: 999px;
    border: 1px solid var(--gold-line);
    background: var(--gold-soft);
    color: #7a6c4e;
    font-size: 0.65rem;
    font-weight: 800;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  .source-tag.ai {
    border-color: var(--dr-line);
    background: var(--dr-soft);
    color: var(--dr);
  }
  .source-tag.problemset {
    border-color: var(--gold-line);
    background: var(--gold-soft);
    color: #7a6c4e;
  }
  .question-text {
    font-family: var(--font-serif);
    font-size: 1.25rem;
    font-weight: 600;
    line-height: 1.45;
    letter-spacing: -0.01em;
    margin-bottom: 24px;
    color: var(--ink-strong);
    white-space: pre-line;
  }

  .question-visual {
    margin: -6px 0 24px;
    padding: 16px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: rgba(255,255,255,0.62);
    overflow-x: auto;
  }
  .question-visual svg {
    display: block;
    width: 100%;
    height: auto;
    min-width: 420px;
    font-family: var(--font-sans);
  }
  .visual-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(220px, 1fr));
    gap: 12px;
    min-width: 460px;
  }
  .visual-grid .wide {
    grid-column: 1 / -1;
    max-width: none;
  }
  .mini-rent {
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--panel);
    padding: 10px;
  }
  .mini-title {
    font-family: var(--font-serif);
    font-size: 0.96rem;
    font-weight: 800;
    margin-bottom: 4px;
    color: var(--ink-strong);
  }
  .branchen-visual-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(320px, 1fr));
    gap: 16px;
    min-width: 680px;
  }
  .branchen-panel {
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--panel);
    padding: 10px;
  }
  .branchen-panel svg {
    display: block;
    width: 100%;
    height: auto;
    min-width: 300px;
    font-family: var(--font-sans);
  }
  .value-table {
    width: 100%;
    border-collapse: collapse;
    min-width: 520px;
    font-size: 0.84rem;
    background: var(--panel);
  }
  .value-table th,
  .value-table td {
    border: 1px solid var(--line-strong);
    padding: 10px 12px;
    text-align: center;
    vertical-align: middle;
  }
  .value-table th {
    background: var(--panel-soft);
    color: var(--ink-strong);
    font-weight: 800;
  }
  .value-table td:first-child,
  .value-table th:first-child {
    text-align: left;
    font-weight: 800;
  }
  .statement-info-table {
    min-width: 560px;
  }
  .statement-info-table td:nth-child(1),
  .statement-info-table td:nth-child(3) {
    text-align: left;
    font-weight: 800;
  }
  .statement-info-table td:nth-child(2),
  .statement-info-table td:nth-child(4) {
    text-align: right;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .options { display: flex; flex-direction: column; gap: 10px; }
  .option {
    display: flex;
    align-items: center;
    width: 100%;
    padding: 14px 16px;
    background: var(--panel-soft);
    border: 1.5px solid var(--line);
    border-radius: 14px;
    color: var(--ink-strong);
    font-family: inherit;
    font-size: 0.92rem;
    line-height: 1.5;
    text-align: left;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .option:hover:not(:disabled) {
    border-color: var(--gold-line);
    background: var(--gold-soft);
    transform: translateX(2px);
  }
  .option:disabled { cursor: default; }
  .option.correct {
    background: var(--cr-soft);
    border-color: var(--cr-line);
    color: #3f4f33;
  }
  .option.wrong {
    background: var(--bad-soft);
    border-color: var(--bad-line);
    color: #7a3f37;
    animation: shake 0.35s ease-out;
  }
  .option.dimmed { opacity: 0.45; }
  .option-letter {
    flex-shrink: 0;
    width: 28px;
    height: 28px;
    line-height: 26px;
    text-align: center;
    border: 1px solid var(--line-strong);
    border-radius: 50%;
    margin-right: 14px;
    font-weight: 800;
    font-size: 0.74rem;
    font-family: var(--font-mono);
    color: var(--mute);
    background: var(--panel);
  }
  .option.correct .option-letter { border-color: var(--cr-line); background: rgba(140,159,116,0.32); color: #3f4f33; }
  .option.wrong .option-letter   { border-color: var(--bad-line); background: rgba(216,180,174,0.4); color: #7a3f37; }
  .rent-options {
    display: grid;
    grid-template-columns: repeat(2, minmax(220px, 1fr));
    gap: 12px;
  }
  .rent-option {
    display: block;
    padding: 0;
    overflow: hidden;
    background: var(--panel);
  }
  .rent-option .mini-rent {
    border: 0;
    border-radius: 12px;
    background: transparent;
    padding: 12px;
  }
  .rent-option svg {
    display: block;
    width: 100%;
    height: auto;
    min-width: 220px;
    font-family: var(--font-sans);
  }

  /* ─── Feedback panel ─────────────────────────────────────── */
  .feedback {
    margin-top: 22px;
    padding: 18px 20px;
    border-radius: 14px;
    background: var(--panel-soft);
    border: 1px solid var(--line);
    border-left: 3px solid var(--cr);
    animation: fadeIn 0.35s ease-out;
  }
  .feedback.wrong { border-left-color: var(--bad); }
  .feedback-title {
    font-size: 0.85rem;
    font-weight: 800;
    margin-bottom: 8px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .feedback-title.ok   { color: #5a6f49; }
  .feedback-title.bad  { color: #7a3f37; }
  .feedback-body {
    font-size: 0.88rem;
    line-height: 1.6;
    color: var(--mute);
  }

  /* T-account visualization */
  .t-acct {
    margin-top: 16px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
    font-size: 0.82rem;
    background: var(--panel);
    font-family: var(--font-mono);
  }
  .t-head {
    padding: 8px 12px;
    font-weight: 800;
    text-align: center;
    letter-spacing: 0.16em;
    font-size: 0.66rem;
    background: var(--panel-soft);
    text-transform: uppercase;
    font-family: var(--font-sans);
  }
  .t-head.dr { color: var(--dr); border-right: 1px solid var(--line); }
  .t-head.cr { color: #5a6f49; }
  .t-cell {
    padding: 10px 12px;
    min-height: 42px;
    display: flex;
    justify-content: space-between;
    gap: 12px;
  }
  .t-cell.dr { border-right: 1px solid var(--line); color: var(--ink-strong); }
  .t-cell.cr { color: var(--ink-strong); }
  .t-cell .amt { color: var(--faint); font-variant-numeric: tabular-nums; font-weight: 700; }

  .next-btn-row {
    margin-top: 20px;
    display: flex;
    justify-content: flex-end;
    gap: 10px;
  }
  .next-btn {
    background: var(--gold-soft);
    color: var(--ink-strong);
    font-weight: 800;
    border: 1px solid var(--gold-line);
    animation: goldPulse 2.6s ease-in-out infinite;
  }
  .next-btn:hover { background: rgba(196,178,143,0.36); }

  /* ─── Results screen ─────────────────────────────────────── */
  .results {
    text-align: center;
    padding: 8px 4px;
    animation: fadeIn 0.5s ease-out;
  }
  .score-big {
    font-family: var(--font-serif);
    font-size: 4.8rem;
    font-weight: 700;
    line-height: 1;
    letter-spacing: -0.05em;
    color: var(--ink-strong);
    margin-bottom: 10px;
  }
  .score-pct {
    color: var(--faint);
    font-size: 0.75rem;
    margin-bottom: 8px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    font-weight: 600;
  }
  .score-msg {
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--ink-strong);
    margin-bottom: 28px;
    font-family: var(--font-serif);
  }
  .review-title {
    font-size: 0.7rem;
    color: var(--faint);
    letter-spacing: 0.18em;
    text-align: left;
    margin: 24px 0 12px;
    text-transform: uppercase;
    font-weight: 700;
  }
  .review-item {
    text-align: left;
    padding: 16px 18px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-left: 3px solid var(--bad);
    border-radius: 14px;
    margin-bottom: 10px;
    font-size: 0.86rem;
    line-height: 1.55;
    box-shadow: var(--shadow-sm);
  }
  .review-item .q {
    color: var(--ink-strong);
    margin-bottom: 8px;
    font-weight: 600;
    font-family: var(--font-serif);
    font-size: 0.95rem;
  }
  .review-item .yours { color: #7a3f37; font-size: 0.8rem; }
  .review-item .correct-text { color: #5a6f49; font-size: 0.8rem; margin-top: 2px; font-weight: 600; }

  .action-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 28px; }
  .action-row .btn { flex: 1 1 160px; justify-content: center; }
  .action-row .btn-primary { width: auto; }

  .kbd {
    display: inline-block;
    padding: 1px 7px;
    font-size: 0.7rem;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--panel);
    color: var(--mute);
    margin: 0 1px;
    font-family: var(--font-mono);
  }

  /* ─── Top bar (sync + settings) ───────────────────────────── */
  .topbar {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 8px;
    margin-bottom: 16px;
  }
  .sync-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 12px;
    border-radius: 999px;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--mute);
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.04em;
  }
  .sync-pill.local   { color: var(--faint); }
  .sync-pill.saving  { color: #7a6c4e; background: var(--gold-soft); border-color: var(--gold-line); }
  .sync-pill.synced  { color: #5a6f49; background: var(--cr-soft); border-color: var(--cr-line); }

let audioCtx = null;

function getAudioCtx() {
  const AudioContext = window.AudioContext || window.webkitAudioContext;
  if (!AudioContext) return null;
  if (!audioCtx) audioCtx = new AudioContext();
  if (audioCtx.state === "suspended") audioCtx.resume().catch(() => {});
  return audioCtx;
}

function playTone(freq, start, duration, opts = {}) {
  const ctx = getAudioCtx();
  if (!ctx) return;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  const filter = ctx.createBiquadFilter();
  osc.type = opts.type || "sine";
  osc.frequency.setValueAtTime(freq, start);
  if (opts.toFreq) osc.frequency.exponentialRampToValueAtTime(opts.toFreq, start + duration);
  filter.type = opts.filterType || "lowpass";
  filter.frequency.setValueAtTime(opts.filterFreq || 6000, start);
  gain.gain.setValueAtTime(0.0001, start);
  gain.gain.exponentialRampToValueAtTime(opts.gain || 0.08, start + 0.015);
  gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
  osc.connect(filter);
  filter.connect(gain);
  gain.connect(ctx.destination);
  osc.start(start);
  osc.stop(start + duration + 0.03);
}

  const ctx = getAudioCtx();
  if (!ctx) return;
  const t = ctx.currentTime;

    playTone(freq, t + i * 0.075, 0.16, { type: "triangle", gain: 0.06, filterFreq: 7000 });
  });
  playTone(1318.51, t + 0.32, 0.24, { type: "sine", gain: 0.045, filterFreq: 8000 });
}

  const ctx = getAudioCtx();

  const t = ctx.currentTime;

    [392, 369.99],

  const img = document.getElementById("ponyImg");
  if (!el || !img || !PONY_IMAGES.length) return;

  // Pick a random pony, avoiding the most recent few
  const avoidCount = Math.min(8, PONY_IMAGES.length - 1);
  let url;
  do {
    url = PONY_IMAGES[Math.floor(Math.random() * PONY_IMAGES.length)];
  } while (ponyState.recent.includes(url));
  ponyState.recent.push(url);
  if (ponyState.recent.length > avoidCount) ponyState.recent.shift();

  img.src = url;
  el.classList.remove("hide");
  // Force reflow to restart animation if already showing
  void el.offsetWidth;
  el.classList.add("show");
  el.setAttribute("aria-hidden", "false");

  clearTimeout(ponyState.hideTimer);
  ponyState.hideTimer = setTimeout(hidePonyReward, 2800);
}

function hidePonyReward() {
  const el = document.getElementById("ponyReward");
  if (!el) return;
  clearTimeout(ponyState.hideTimer);
  el.classList.remove("show");
  el.classList.add("hide");
  el.setAttribute("aria-hidden", "true");
}

document.addEventListener("DOMContentLoaded", () => {
  const closeBtn = document.getElementById("ponyClose");
  if (closeBtn) closeBtn.addEventListener("click", hidePonyReward);
});

// QUESTION IDS — stable across reorderings/insertions, derived from prompt
// ═══════════════════════════════════════════════════════════════════════════
function hashId(s) {
  let h = 5381;
  for (let i = 0; i < s.length; i++) h = ((h << 5) + h) + s.charCodeAt(i);
  return "q" + (h >>> 0).toString(36);
}
function addQuestionDeck(q, deckId) {
  q.decks = Array.isArray(q.decks) ? q.decks : [];
  if (!q.decks.includes(deckId)) q.decks.push(deckId);
}

QUESTIONS.forEach(q => {
  if (q.subject !== "BWL II") return;
  const prompt = String(q.prompt || "");
  const visual = String(q.visual || "");
  let mathDeck = Array.isArray(q.decks) && q.decks.includes("BWL2-MATH");
  let categoryDeck = "";

  if (visual.includes("producer-rent")) categoryDeck = "BWL2-MATH-RENT";
  else if (visual.includes("indifference")) categoryDeck = "BWL2-MATH-INDIFF";
  else if (visual.includes("experience")) categoryDeck = "BWL2-MATH-EXPERIENCE";
  else if (
    visual.includes("value-table") ||
    visual.includes("oilster-table") ||
    /Wertschöpfung .* Stufe|Wertschöpfungskette/.test(prompt)
  ) categoryDeck = "BWL2-MATH-VALUE";
  else if (
    /^TK\(/.test(prompt) ||
    /TK\(Q\)|Totalkostenfunktion|minimale Einstiegsmenge|Kostennachteil/.test(prompt)
  ) categoryDeck = "BWL2-MATH-COST";

  if (categoryDeck) {
    addQuestionDeck(q, "BWL2-MATH");
    addQuestionDeck(q, categoryDeck);
    mathDeck = true;
  }

  if (!mathDeck) return;
  if (!categoryDeck && /TK\(Q\)|Totalkostenfunktion|minimale Einstiegsmenge|Kostennachteil/.test(prompt)) {
    addQuestionDeck(q, "BWL2-MATH-COST");
  }
});

const seenQuestionIds = new Map();
QUESTIONS.forEach(q => {
  const baseId = hashId(q.prompt);
  const seen = seenQuestionIds.get(baseId) || 0;
  seenQuestionIds.set(baseId, seen + 1);
  q.id = seen ? `${baseId}-${seen + 1}` : baseId;
});

// PERSISTENCE — local storage + optional GitHub Gist sync
// ═══════════════════════════════════════════════════════════════════════════
const GIST_FILENAME  = "journal-quiz-data.json";
const GIST_DESCRIPTION = "Journal Entry Trainer — saved progress";
const PAT_KEY        = "journal-quiz-pat";
const GIST_ID_KEY    = "journal-quiz-gist-id";
const LOCAL_DATA_KEY = "journal-quiz-data";

const DEFAULT_DATA = {
  questionStats: {},   // { id: { attempts, correct, lastWrong, lastSeen } }
  deckBestResults: {}, // { deckId: { pct, score, total, completedAt, label } }
  totalSessions: 0,
  lastUpdated: 0,
  resetAt: 0,
};

function normalizePat(t) {
  return String(t || "")
    .trim()
    .replace(/^Bearer\s+/i, "")
    .replace(/^token\s+/i, "")
    .trim();
}
function getPat()   { return localStorage.getItem(PAT_KEY) || ""; }
function setPat(t)  {
  const token = normalizePat(t);
  if (token) localStorage.setItem(PAT_KEY, token);
  else localStorage.removeItem(PAT_KEY);
}
function getGistId(){ return localStorage.getItem(GIST_ID_KEY) || ""; }
function setGistId(id){ if (id) localStorage.setItem(GIST_ID_KEY, id); else localStorage.removeItem(GIST_ID_KEY); }

function loadLocalData() {
  try {
    const raw = localStorage.getItem(LOCAL_DATA_KEY);
    if (!raw) return freshData();
    return freshData(JSON.parse(raw));
  } catch { return freshData(); }
}
function saveLocalData(data) {
  try { localStorage.setItem(LOCAL_DATA_KEY, JSON.stringify(data)); } catch {}
}

function freshData(data = {}) {
  return {
    ...DEFAULT_DATA,
    ...data,
    questionStats: { ...(data.questionStats || {}) },
    deckBestResults: { ...(data.deckBestResults || {}) },
    resetAt: Number(data.resetAt || 0),
  };
}

function resetProgressData() {
  const now = Date.now();
  return freshData({ lastUpdated: now, resetAt: now });
}

async function gistFetch(path, opts = {}) {
  const pat = getPat();
  if (!pat) throw new Error("No PAT configured");
  const r = await fetch(`https://api.github.com${path}`, {
    ...opts,
    headers: {
      Authorization: `Bearer ${pat}`,
      Accept: "application/vnd.github+json",
      "Content-Type": "application/json",
      "X-GitHub-Api-Version": "2022-11-28",
      ...(opts.headers || {})
    },
  });
  if (!r.ok) {
    let detail = r.statusText;
    try {
      const body = await r.json();
      detail = body && body.message ? body.message : detail;
    } catch {
      try { detail = await r.text() || detail; } catch {}
    }
    throw new Error(`GitHub API ${r.status}: ${detail}`);
  }
  return r.json();
}

async function findExistingProgressGist() {
  const gists = await gistFetch("/gists?per_page=100");
  if (!Array.isArray(gists)) return null;
  const matches = gists
    .filter(g => g && g.id && g.files && g.files[GIST_FILENAME])
    .sort((a, b) => new Date(b.updated_at || 0) - new Date(a.updated_at || 0));
  const exact = matches.find(g => g.description === GIST_DESCRIPTION);
  const gist = exact || matches[0] || null;
  if (gist) setGistId(gist.id);
  return gist;
}

async function loadGistData() {
  const existing = await findExistingProgressGist();
  const gistId = existing && existing.id ? existing.id : getGistId();
  if (!gistId) return null;
  const gist = await gistFetch(`/gists/${gistId}`);
  const file = gist.files && gist.files[GIST_FILENAME];
  if (!file) return null;
  try { return freshData(JSON.parse(file.content)); }
  catch { return null; }
}

let _gistSaveInFlight = null;
let _gistSavePending = null;

async function _drainGistSave() {
  try {
    while (_gistSavePending) {
      const data = _gistSavePending;
      _gistSavePending = null;
      await saveGistData(data);
    }
    setSyncStatus("synced");
  } catch (e) {
    console.warn("Gist save failed:", e);
    setSyncStatus("error", syncErrorText(e));
  } finally {
    _gistSaveInFlight = null;
  }
}

function queueGistSave(data) {
  saveLocalData(data);
  if (!getPat()) { setSyncStatus("local"); return; }
  _gistSavePending = data;
  setSyncStatus("saving");
  if (!_gistSaveInFlight) _gistSaveInFlight = _drainGistSave();
}

async function saveGistData(data) {
  const existing = await findExistingProgressGist();
  let gistId = existing && existing.id ? existing.id : getGistId();
  const body = { files: { [GIST_FILENAME]: { content: JSON.stringify(data, null, 2) } } };
  if (gistId) {
    try {
      return await gistFetch(`/gists/${gistId}`, { method: "PATCH", body: JSON.stringify(body) });
    } catch (e) {
      if (!isGistNotFoundError(e)) throw e;
      setGistId("");
    }
  }
  const gist = await gistFetch("/gists", {
    method: "POST",
    body: JSON.stringify({ description: GIST_DESCRIPTION, public: false, ...body }),
  });
  setGistId(gist.id);
  return gist;
}

// Merge two data snapshots: take whichever has more attempts per question.
function mergeData(a, b) {
  a = freshData(a);
  b = freshData(b);
  if ((a.resetAt || 0) > (b.lastUpdated || 0) && (a.resetAt || 0) >= (b.resetAt || 0)) return a;
  if ((b.resetAt || 0) > (a.lastUpdated || 0) && (b.resetAt || 0) >= (a.resetAt || 0)) return b;
  const out = freshData(a);
  out.questionStats = { ...(a.questionStats || {}) };
  for (const [id, sb] of Object.entries(b.questionStats || {})) {
    const sa = out.questionStats[id];
    if (!sa || (sb.attempts || 0) > (sa.attempts || 0)) {
      out.questionStats[id] = sb;
    }
  }
  out.deckBestResults = { ...(a.deckBestResults || {}) };
  for (const [id, rb] of Object.entries(b.deckBestResults || {})) {
    const ra = out.deckBestResults[id];
    if (isBetterDeckResult(rb, ra)) out.deckBestResults[id] = rb;
  }
  out.totalSessions = Math.max(a.totalSessions || 0, b.totalSessions || 0);
  out.lastUpdated   = Math.max(a.lastUpdated   || 0, b.lastUpdated   || 0);
  out.resetAt       = Math.max(a.resetAt       || 0, b.resetAt       || 0);
  return out;
}

function isBetterDeckResult(next, current) {
  if (!next) return false;
  if (!current) return true;
  const nextPct = Number(next.pct) || 0;
  const currentPct = Number(current.pct) || 0;
  if (nextPct !== currentPct) return nextPct > currentPct;
  return (Number(next.total) || 0) > (Number(current.total) || 0);
}

// STATS HELPERS
// ═══════════════════════════════════════════════════════════════════════════
function recordAnswer(q, isCorrect) {
  const id = q.id;
  const s = state.data.questionStats[id] || { attempts: 0, correct: 0, lastWrong: 0, lastSeen: 0 };
  s.attempts++;
  if (isCorrect) s.correct++;
  else s.lastWrong = Date.now();
  s.lastSeen = Date.now();
  state.data.questionStats[id] = s;
  state.data.lastUpdated = Date.now();
}

function weaknessScore(q) {
  const s = state.data.questionStats[q.id];
  if (!s || !s.attempts) return -1; // never seen → handled separately
  const errorRate = (s.attempts - s.correct) / s.attempts;
  // Recency: a recent wrong answer matters more (decay over ~14 days)
  const ageDays = s.lastWrong ? (Date.now() - s.lastWrong) / 86400000 : 999;
  const recency = Math.exp(-ageDays / 14);
  return errorRate * (0.5 + 0.5 * recency);
}

function getWeakestPool(limit = 15) {
  const inSubject = i => questionSubject(QUESTIONS[i]) === state.subject;
  const seen = QUESTIONS
    .map((q, i) => ({ i, q, score: weaknessScore(q), stats: state.data.questionStats[q.id] }))
    .filter(x => inSubject(x.i))
    .filter(x => x.stats && x.stats.attempts > 0);
  // Highest weakness first; tiebreaker: fewer attempts (less data → review)
  seen.sort((a, b) => b.score - a.score || (a.stats.attempts - b.stats.attempts));
  let result = seen.filter(x => x.score > 0).slice(0, limit).map(x => x.i);
  // If still short, fill with unseen questions (still subject-filtered)
  if (result.length < limit) {
    const unseen = QUESTIONS
      .map((q, i) => ({ i, stats: state.data.questionStats[q.id] }))
      .filter(x => inSubject(x.i))
      .filter(x => !x.stats || !x.stats.attempts);
    for (const u of unseen) {
      if (result.length >= limit) break;
      result.push(u.i);
    }
  }
  return result;
}

function totalAttempts() {
  const ids = new Set(QUESTIONS.filter(q => questionSubject(q) === state.subject).map(q => q.id));
  return Object.entries(state.data.questionStats)
    .filter(([id]) => ids.has(id))
    .reduce((a, [, s]) => a + (s.attempts || 0), 0);
}
function totalQuestionsSeen() {
  const ids = new Set(QUESTIONS.filter(q => questionSubject(q) === state.subject).map(q => q.id));
  return Object.entries(state.data.questionStats)
    .filter(([id, s]) => ids.has(id) && s && s.attempts > 0).length;
}

function formatTimer(seconds) {
  const s = Math.max(0, seconds | 0);
  const mins = Math.floor(s / 60);
  return `${mins}:${String(s % 60).padStart(2, "0")}`;
}

function stopQuestionTimer() {
  if (!state.timerId) return;
  clearInterval(state.timerId);
  state.timerId = null;
}

function updateTimerDisplay() {
  const el = document.getElementById("timerPill");
  if (!el || !state.timerSeconds || state.answered) return;
  const remaining = Math.max(0, Math.ceil((state.timerDeadline - Date.now()) / 1000));
  state.timerRemaining = remaining;
  el.textContent = formatTimer(remaining);
  el.classList.toggle("warning", remaining <= 30 && remaining > 10);
  el.classList.toggle("danger", remaining <= 10);
  if (remaining > 0 && remaining <= 10 && remaining !== state.lastTickSecond) {
    state.lastTickSecond = remaining;
    playClockTick();
  }
  if (remaining <= 0) expireQuestionTimer();
}

function startQuestionTimer() {
  stopQuestionTimer();
  if (!state.timerSeconds || state.screen !== "quiz" || state.answered) return;
  state.timerRemaining = state.timerSeconds;
  state.timerDeadline = Date.now() + state.timerSeconds * 1000;
  state.lastTickSecond = null;
  updateTimerDisplay();
  state.timerId = setInterval(updateTimerDisplay, 250);
}

function expireQuestionTimer() {
  if (state.answered) return;
  stopQuestionTimer();
  pickAnswer(-1, true);
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function syncStatusLabel(s) {
  if (s === "synced")    return "Synced";
  if (s === "saving")    return "Saving…";
  if (s === "error")     return "Sync error";
  if (s === "connected") return "Connected";
  return "Local only";
}

function setSyncStatus(s, errorMessage = "") {
  state.syncStatus = s;
  state.syncError = s === "error" ? String(errorMessage || "Sync failed. Check the token and try again.") : "";
  const el = document.getElementById("syncPill");
  if (el) {
    el.className = "sync-pill " + s;
    el.innerHTML = `<span class="dot"></span>${escapeHtml(syncStatusLabel(s))}`;
  }
}

function syncErrorText(e) {
  const msg = e && e.message ? e.message : String(e || "Unknown sync error");
  if (msg.includes("401")) return `${msg}. The token was rejected. Generate a new token and paste only the token value.`;
  if (msg.includes("403")) return `${msg}. Use a classic token with only the gist scope, or a fine-grained token with Account permissions -> Gists set to Write if GitHub shows that option.`;
  if (msg.includes("404")) return `${msg}. The saved Gist may no longer exist or this token cannot access it. Disconnect and sync again to create a new private Gist.`;
  return msg;
}

function isGistNotFoundError(e) {
  return !!(e && e.message && e.message.includes("GitHub API 404"));
}

  return `

        <div class="modal-section">
          <span class="modal-label">Cloud sync (optional)</span>
          <p class="modal-help">
            Save your progress to a private GitHub Gist so you can resume on any device.
            Recommended: create a classic token at
            <a href="https://github.com/settings/tokens/new" target="_blank" rel="noopener">github.com/settings/tokens/new</a>
            and check only the <b>gist</b> scope. A fine-grained token can also work if GitHub shows
            <b>Account permissions -> Gists</b> and lets you set it to <b>Write</b>.
          </p>
          <input type="password" id="patInput" placeholder="github_pat_… or ghp_…" value="${escapeHtml(pat)}" autocomplete="off" spellcheck="false">

          ${state.syncError ? `<div class="modal-info error">${escapeHtml(state.syncError)}</div>` : ""}
        </div>

          <div class="modal-row">

          </div>

        </div>
      </div>

function wireSettingsModal() {
  document.getElementById("settingsBackdrop").addEventListener("click", (e) => {
    if (e.target.id === "settingsBackdrop") {
      state.settingsOpen = false;
      render();
    }
  });
  document.getElementById("closeSettingsBtn").addEventListener("click", () => {
    state.settingsOpen = false;
    render();
  });
  document.getElementById("savePatBtn").addEventListener("click", async () => {
    const v = normalizePat(document.getElementById("patInput").value);
    if (!v) return;
    const oldPat = getPat();
    const oldGistId = getGistId();
    setPat(v);
    setSyncStatus("saving");
    try {
      // Try to load any existing gist; merge with local data
      let remote = null;
      try {
        remote = await loadGistData();
      } catch (e) {
        if (!isGistNotFoundError(e)) throw e;
        setGistId("");
      }
      if (remote) state.data = mergeData(state.data, remote);
      state.data.lastUpdated = Date.now();
      // Save merged result back
      await saveGistData(state.data);
      saveLocalData(state.data);
      setSyncStatus("synced");
      state.settingsOpen = false;
    } catch (e) {
      console.warn(e);
      setPat(oldPat);
      setGistId(oldGistId);
      setSyncStatus("error", syncErrorText(e));
    }
    render();
  });
  const disc = document.getElementById("disconnectBtn");
  if (disc) disc.addEventListener("click", () => {
    setPat("");
    setGistId("");
    setSyncStatus("local");
    state.settingsOpen = false;
    render();
  });
  document.getElementById("resetBtn").addEventListener("click", async () => {
    if (!confirm("Reset all local progress? This cannot be undone.")) return;
    state.data = resetProgressData();
    saveLocalData(state.data);
    setSyncStatus(getPat() ? "saving" : "local");
    if (getPat()) {
      try {
        await saveGistData(state.data);
        setSyncStatus("synced");
      } catch (e) {
        console.warn(e);
        setSyncStatus("error", syncErrorText(e));
      }
    }
    state.settingsOpen = state.syncStatus === "error";
    render();
  });
}

function startWeakQuiz() {
  stopQuestionTimer();
  getAudioCtx();
  const pool = getWeakestPool(15);
  if (!pool.length) return;
  state.mode = "weak";
  state.deckId = null;
  state.order = shuffle(pool);
  state.idx = 0;
  state.score = 0;
  state.streak = 0;
  state.bestStreak = 0;
  state.resultRecorded = false;
  state.wrong = [];
  state.screen = "quiz";
  loadCurrent();
  render();
}

function startDeckQuiz(deckId) {
  stopQuestionTimer();
  getAudioCtx();
  const deck = getDeckById(deckId);
  if (!deck) return;
  const pool = deckPool(deck);
  if (!pool.length) return;
  state.mode = "deck";
  state.deckId = deckId;
  state.order = shuffle(pool);
  state.idx = 0;
  state.score = 0;
  state.streak = 0;
  state.bestStreak = 0;
  state.resultRecorded = false;
  state.wrong = [];
  state.screen = "quiz";
  loadCurrent();
  render();
}

function startMistakeQuiz(questionIndices) {
  stopQuestionTimer();
  getAudioCtx();
  const pool = [...new Set(questionIndices)]
    .filter(i => Number.isInteger(i) && QUESTIONS[i] && hasAnswerKey(QUESTIONS[i]));
  if (!pool.length) return;
  state.mode = "mistakes";
  state.order = shuffle(pool);
  state.idx = 0;
  state.score = 0;
  state.streak = 0;
  state.bestStreak = 0;
  state.resultRecorded = false;
  state.wrong = [];
  state.screen = "quiz";
  loadCurrent();
  render();
}

function startQuiz() {
  stopQuestionTimer();
  getAudioCtx();
  const subjectPool = subjectIndices(state.subject);
  const pool = state.subject === "BWL II"
    ? bwlSelectedPool()
    : state.selectedCats.size === 0
    ? subjectPool
    : subjectPool.filter(i => state.selectedCats.has(QUESTIONS[i].category));
  if (!pool.length) return;
  state.mode = state.subject === "BWL II" ? "bwl-selection" : "all";
  state.deckId = null;
  state.order = shuffle(pool);
  state.idx = 0;
  state.score = 0;
  state.streak = 0;
  state.bestStreak = 0;
  state.resultRecorded = false;
  state.wrong = [];
  state.screen = "quiz";
  loadCurrent();
  render();
}

function loadCurrent() {
  state.answered = false;
  state.picked = -1;
  const q = QUESTIONS[state.order[state.idx]];
  const orderedOptions = q.options.map((_, i) => i);
  state.optionOrder = isProducerRentQuestion(q) ? orderedOptions : shuffle(orderedOptions);
}

function renderQuiz() {
  const q = QUESTIONS[state.order[state.idx]];
  const total = state.order.length;
  const pct = Math.round((state.idx / total) * 100);

  app.innerHTML = `
    ${renderSubjectTabs()}
    <div class="meta-row">
      <div>Question ${state.idx + 1} of ${total}</div>
      <div>
        ${state.timerSeconds ? `<span class="timer-pill" id="timerPill">${formatTimer(state.timerSeconds)}</span>` : ""}
        <span class="score-pill">✓ ${state.score}</span>
        ${state.streak > 1 ? `<span class="streak-pill">🔥 ${state.streak}</span>` : ""}
      </div>
    </div>
    <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="qcard">
      <div class="q-meta">
        <span class="cat-tag">${escapeHtml(q.category)}</span>
        ${renderSourceBadge(q)}
      </div>
      <div class="question-text">${escapeHtml(q.prompt)}</div>
      ${isProducerRentQuestion(q) ? "" : renderQuestionVisual(q.visual)}
      ${renderQuestionOptions(q)}
      <div id="feedbackSlot"></div>
    </div>
  `;

  document.querySelectorAll("#options .option").forEach(b => {
    b.addEventListener("click", () => pickAnswer(parseInt(b.dataset.i, 10)));

}

function renderQuestionOptions(q) {
  if (isProducerRentQuestion(q)) return renderProducerRentOptions(q);
  return `
    <div class="options" id="options">
      ${state.optionOrder.map((origIdx, displayIdx) => {
        const letter = "ABCDE"[displayIdx];
        return `<button class="option" data-i="${displayIdx}">
          <span class="option-letter">${letter}</span>
          <span>${escapeHtml(q.options[origIdx])}</span>
        </button>`;
      }).join("")}

function isProducerRentQuestion(q) {
  return rentScenariosForQuestion(q).length === q.options.length && q.options.length > 0;
}

function rentScenariosForQuestion(q) {
  if (Array.isArray(q.rentScenarios)) return q.rentScenarios;

function renderRentBar(x, suffix, values, side) {
  const barW = 34;
  const base = 148;
  const scale = 11;
  const y = value => base - value * scale;
  const labelX = side < 0 ? x - 25 : x + 25;
  const anchor = side < 0 ? "end" : "start";
  const label = (letter, value) => `
    <text x="${labelX}" y="${y(value) + 4}" text-anchor="${anchor}" font-size="12" font-weight="700">
      ${letter}<tspan baseline-shift="sub" font-size="8">${suffix}</tspan> = ${value}
    </text>
  `;
  const bpLabels = values.b === values.p ? `
    <text x="${x}" y="${y(values.b) - 6}" text-anchor="middle" font-size="11" font-weight="700">
      B<tspan baseline-shift="sub" font-size="8">${suffix}</tspan> = P<tspan baseline-shift="sub" font-size="8">${suffix}</tspan> = ${values.b}
    </text>
  ` : `${label("B", values.b)}${label("P", values.p)}`;
  return `
    <rect x="${x - barW / 2}" y="${y(values.b)}" width="${barW}" height="${values.b * scale}" fill="#fff" stroke="#111" stroke-width="1.2"/>
    <rect x="${x - barW / 2}" y="${y(values.k)}" width="${barW}" height="${values.k * scale}" fill="#9ca3af" stroke="#111" stroke-width="1.1"/>
    <line x1="${x - barW / 2}" y1="${y(values.p)}" x2="${x + barW / 2}" y2="${y(values.p)}" stroke="#111" stroke-width="1.3"/>
    ${bpLabels}
    ${label("K", values.k)}
  `;
}

function pickAnswer(displayIdx, timedOut = false) {
  if (state.answered) return;
  getAudioCtx();
  stopQuestionTimer();
  state.answered = true;
  state.picked = displayIdx;
  const questionIndex = state.order[state.idx];
  const q = QUESTIONS[questionIndex];
  const answerKeyAvailable = hasAnswerKey(q);
  const pickedOriginal = timedOut ? -1 : state.optionOrder[displayIdx];
  const correctDisplay = answerKeyAvailable ? state.optionOrder.indexOf(q.correct) : -1;
  const isCorrect = answerKeyAvailable && !timedOut && pickedOriginal === q.correct;

  if (isCorrect) {
    state.score++;
    state.streak++;
    state.bestStreak = Math.max(state.bestStreak, state.streak);
    showPonyReward();
    playHappyPonySound();
  } else if (answerKeyAvailable) {
    state.streak = 0;
    playSadViolinSound();
    state.wrong.push({
      questionIndex,
      prompt: q.prompt,
      picked: timedOut ? "Time expired" : q.options[pickedOriginal],
      correct: q.options[q.correct],
      explanation: q.explanation,
    });
  } else {
    state.streak = 0;
  }

  if (answerKeyAvailable) {
    recordAnswer(q, isCorrect);
    queueGistSave(state.data);
  }

  // Highlight options
  document.querySelectorAll("#options .option").forEach((btn, i) => {
    btn.disabled = true;
    if (answerKeyAvailable && i === correctDisplay) btn.classList.add("correct");
    else if (!timedOut && i === displayIdx) btn.classList.add(answerKeyAvailable ? "wrong" : "correct");
    else btn.classList.add("dimmed");
  });

  // Render feedback
  const slot = document.getElementById("feedbackSlot");
  slot.innerHTML = `
    <div class="feedback ${isCorrect || !answerKeyAvailable ? "" : "wrong"}">
      <div class="feedback-title ${isCorrect || !answerKeyAvailable ? "ok" : "bad"}">
        ${answerKeyAvailable
          ? (timedOut ? "Time expired" : (isCorrect ? "✓ Correct" : "✗ Not quite"))
          : "Answer key not available"}
      </div>
      <div class="feedback-body">${escapeHtml(answerKeyAvailable ? q.explanation : "This question was imported from the scanned June 2017 PDF. The scan contains the question and choices, but no reliable official answer key.")}</div>
      ${renderTAccount(q.entry)}
    </div>
    <div class="next-btn-row">
      <button class="btn next-btn" id="nextBtn">
        ${state.idx + 1 < state.order.length ? "Next →" : "See results"}
      </button>
    </div>
  `;
  document.getElementById("nextBtn").addEventListener("click", next);
}

function renderTAccount(entry) {
  if (!entry) return "";
  const rows = Math.max(entry.debits.length, entry.credits.length);
  let cells = "";
  for (let i = 0; i < rows; i++) {
    const d = entry.debits[i];
    const c = entry.credits[i];
    cells += `
      <div class="t-cell dr">${d ? `<span>${escapeHtml(d[0])}</span><span class="amt">${escapeHtml(d[1] || "")}</span>` : ""}</div>
      <div class="t-cell cr">${c ? `<span style="padding-left:14px;">${escapeHtml(c[0])}</span><span class="amt">${escapeHtml(c[1] || "")}</span>` : ""}</div>
    `;
  }
  return `
    <div class="t-acct">
      <div class="t-head dr">DEBIT</div>
      <div class="t-head cr">CREDIT</div>
      ${cells}
    </div>
  `;
}

function next() {
  if (state.idx + 1 < state.order.length) {
    state.idx++;
    loadCurrent();
    render();
  } else {
    state.screen = "results";
    render();
  }
}

function recordCompletedDeckResult(scoredTotal, pct) {
  if (state.resultRecorded) return;
  state.resultRecorded = true;
  if (state.mode !== "deck" || !state.deckId || !scoredTotal) return;

  const deck = getDeckById(state.deckId);
  const result = {
    pct,
    score: state.score,
    total: scoredTotal,
    completedAt: Date.now(),
    label: deck ? deck.label : state.deckId,
  };
  state.data.deckBestResults = { ...(state.data.deckBestResults || {}) };
  if (isBetterDeckResult(result, state.data.deckBestResults[state.deckId])) {
    state.data.deckBestResults[state.deckId] = result;
    state.data.lastUpdated = Date.now();
    queueGistSave(state.data);
  }
}

function renderResults() {
  stopQuestionTimer();
  const total = state.order.length;
  const scoredTotal = state.order.filter(i => hasAnswerKey(QUESTIONS[i])).length;
  const unscoredTotal = total - scoredTotal;
  const pct = scoredTotal ? Math.round((state.score / scoredTotal) * 100) : 0;
  const mistakeIndices = [...new Set(state.wrong.map(w => w.questionIndex))]
    .filter(i => Number.isInteger(i) && QUESTIONS[i] && hasAnswerKey(QUESTIONS[i]));
  const canPracticeMistakes = (state.mode === "deck" || state.mode === "mistakes") && mistakeIndices.length > 0;
  let msg = "Back to the books 📚";
  if (!scoredTotal) msg = "Scanned questions reviewed.";
  else if (pct === 100) msg = "Perfect. Auditor-grade. 🏆";
  else if (pct >= 90) msg = "Excellent — you know the ledgers cold.";
  else if (pct >= 75) msg = "Strong result.";
  else if (pct >= 60) msg = "Solid foundation — review the misses below.";
  else if (pct >= 40) msg = "Keep practicing — focus on debit/credit rules.";

  let modeTag = "Mixed practice";
  if (state.mode === "weak") modeTag = "Weakest practice";
  else if (state.mode === "bwl-selection") modeTag = "BWL Themenauswahl";
  else if (state.mode === "deck") {
    const deck = getDeckById(state.deckId);
    modeTag = deck ? deck.label : "Deck";
  } else if (state.mode === "mistakes") {
    const deck = getDeckById(state.deckId);
    modeTag = deck ? `${deck.label} mistakes` : "Practice mistakes";
  }
  recordCompletedDeckResult(scoredTotal, pct);

  app.innerHTML = `
    ${renderSubjectTabs()}
      <div class="results">
      <div class="cat-tag" style="margin-bottom:14px;">${escapeHtml(modeTag)}</div>
      <div class="score-big">${state.score} / ${scoredTotal || total}</div>
      <div class="score-pct">${scoredTotal ? `${pct}% correct · best streak ${state.bestStreak}` : "Unscored scanned set"}${unscoredTotal ? ` · ${unscoredTotal} unscored` : ""}</div>
      <div class="score-msg">${msg}</div>

      ${state.wrong.length ? `
        <div class="review-title">Review · ${state.wrong.length} to re-learn</div>
        ${state.wrong.map(w => `
          <div class="review-item">
            <div class="q">${escapeHtml(w.prompt)}</div>
            <div class="yours">Your answer: ${escapeHtml(w.picked)}</div>
            <div class="correct-text">Correct: ${escapeHtml(w.correct)}</div>
            <div class="feedback-body" style="margin-top:8px;font-size:0.78rem;">${escapeHtml(w.explanation)}</div>
          </div>
        `).join("")}
      ` : ""}

      <div class="action-row">
        <button class="btn btn-ghost" id="homeBtn">← Home</button>
        ${canPracticeMistakes ? `<button class="btn btn-ghost" id="mistakesBtn">Practice mistakes</button>` : ""}
        <button class="btn btn-primary" id="againBtn">${state.mode === "weak" ? "Practice weak again" : state.mode === "deck" ? "Replay deck" : "Play again"}</button>
      </div>
    </div>
  `;
  wireSubjectTabs();
  document.getElementById("homeBtn").addEventListener("click", () => {
    state.screen = "start";
    render();
  });
  document.getElementById("againBtn").addEventListener("click", () => {
    if (state.mode === "weak") startWeakQuiz();
    else if (state.mode === "deck") startDeckQuiz(state.deckId);
    else if (state.mode === "mistakes") startMistakeQuiz(state.order);
    else startQuiz();
  });
  document.getElementById("mistakesBtn")?.addEventListener("click", () => {
    startMistakeQuiz(mistakeIndices);
  });
}

function escapeHtml(s) {
  return String(s ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

// ═══════════════════════════════════════════════════════════════════════════
// KEYBOARD
// ═══════════════════════════════════════════════════════════════════════════
document.addEventListener("keydown", (e) => {
  // Settings modal takes priority — only handle Escape, leave inputs alone.
  if (state.settingsOpen) {
    if (e.key === "Escape") {
      state.settingsOpen = false;
      render();
      e.preventDefault();
    }
    return;
  }
  // Don't hijack typing inside any text input/textarea.
  const tag = (e.target && e.target.tagName) || "";
  if (tag === "INPUT" || tag === "TEXTAREA") return;

  if (state.screen === "quiz") {
    if (!state.answered) {
      const key = e.key.toUpperCase();
      const idx = "ABCDE".indexOf(key);
      if (idx >= 0 && idx < state.optionOrder.length) {
        pickAnswer(idx);
        e.preventDefault();
      }
      const num = parseInt(e.key, 10);
      if (!isNaN(num) && num >= 1 && num <= 5 && num - 1 < state.optionOrder.length) {
        pickAnswer(num - 1);
        e.preventDefault();
      }
    } else if (e.key === "Enter" || e.key === " ") {
      next();
      e.preventDefault();
    }
  } else if (state.screen === "start" && e.key === "Enter") {
    startQuiz();
    e.preventDefault();
  } else if (state.screen === "results" && e.key === "Enter") {
    if (state.mode === "weak") startWeakQuiz();
    else if (state.mode === "deck") startDeckQuiz(state.deckId);
    else if (state.mode === "mistakes") startMistakeQuiz(state.order);
    else startQuiz();
    e.preventDefault();
  }
});

// ═══════════════════════════════════════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════════════════════════════════════
render();

// If a PAT is configured, pull the gist on load so the latest cross-device
// progress wins. Merge with local in case the local copy has newer answers
// recorded while offline.
if (getPat()) {
  setSyncStatus("saving");
  loadGistData()
    .then(async remote => {
      if (remote) {
        state.data = mergeData(state.data, remote);
        saveLocalData(state.data);
      }
      await saveGistData(state.data);
      saveLocalData(state.data);
      if (state.screen === "start") render();
      setSyncStatus("synced");
    })
    .catch(e => {
      console.warn("Initial gist load failed:", e);
      setSyncStatus("error", syncErrorText(e));
    });
}
</script>
</body>
</html>
