<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Journal Entry Trainer — Accounting Quiz</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=IBM+Plex+Mono:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600;700;800&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --dr: #4f7c77;          /* muted teal — debit */
    --cr: #8c9f74;          /* sage — credit */
    --dr-soft: rgba(79,124,119,0.16);
    --cr-soft: rgba(140,159,116,0.20);
    --dr-line: rgba(79,124,119,0.36);
    --cr-line: rgba(140,159,116,0.42);
    --gold: #c4b28f;
    --gold-soft: rgba(196,178,143,0.22);
    --gold-line: rgba(196,178,143,0.5);
    --bad: #b96b5e;
    --bad-soft: rgba(216,180,174,0.28);
    --bad-line: rgba(185,107,94,0.4);
    --ink: #111111;
    --ink-strong: #000000;
    --mute: #374151;
    --faint: #6b7280;
    --line: rgba(17,24,39,0.12);
    --line-strong: rgba(17,24,39,0.22);
    --panel: rgba(255,255,255,0.92);
    --panel-alt: rgba(249,250,251,0.96);
    --panel-soft: rgba(17,24,39,0.035);
    --shadow-sm: 0 10px 26px rgba(15,23,42,0.06);
    --shadow-md: 0 18px 42px rgba(15,23,42,0.08);
    --font-sans: 'IBM Plex Sans','Segoe UI',sans-serif;
    --font-serif: 'Fraunces','Iowan Old Style','Palatino Linotype',serif;
    --font-mono: 'IBM Plex Mono','SFMono-Regular',monospace;
  }

  html { background: #d1d5db; }
  body {
    background: #d1d5db;
    font-family: var(--font-sans);
    color: var(--ink);
    min-height: 100vh;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: 0;
    background:
      radial-gradient(circle at 18% 10%, rgba(156,163,175,0.15) 0%, transparent 34%),
      radial-gradient(circle at 84% 14%, rgba(203,213,225,0.14) 0%, transparent 30%),
      radial-gradient(circle at 50% 115%, rgba(148,163,184,0.12) 0%, transparent 34%),
      repeating-linear-gradient(135deg, rgba(17,24,39,0.018) 0 1px, transparent 1px 24px),
      linear-gradient(180deg, #dadde3 0%, #d4d8de 42%, #d1d5db 100%);
    pointer-events: none;
  }
  body::after {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 2px;
    z-index: 100;
    background: linear-gradient(90deg, transparent 0%, rgba(107,114,128,0.5) 18%, rgba(55,65,81,0.7) 50%, rgba(107,114,128,0.5) 82%, transparent 100%);
    opacity: 0.55;
  }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes pageLift {
    0% { opacity: 0; transform: translateY(10px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  @keyframes goldPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(196,178,143,0); }
    50% { box-shadow: 0 0 12px 2px rgba(196,178,143,0.45); }
  }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25%     { transform: translateX(-4px); }
    75%     { transform: translateX(4px); }
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 600px;
    margin: 0 auto;
    padding: 48px 20px 80px;
    animation: pageLift 0.45s ease-out both;
  }

  /* ─── Start screen ───────────────────────────────────────── */
  .hero { text-align: center; margin-bottom: 32px; animation: fadeIn 0.5s ease-out; }
  .hero h1 {
    font-family: var(--font-serif);
    font-size: 2.8rem;
    font-weight: 700;
    letter-spacing: -0.05em;
    line-height: 1;
    color: var(--ink-strong);
    margin-bottom: 10px;
  }
  .hero .sub {
    color: var(--faint);
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    font-weight: 600;
  }

  .start-card {
    background: linear-gradient(180deg, rgba(255,255,255,0.97), rgba(247,248,250,0.97));
    border: 1px solid var(--line);
    border-radius: 22px;
    padding: 36px 28px;
    box-shadow: var(--shadow-md);
    animation: fadeIn 0.6s ease-out;
  }
  .start-card h2 {
    font-family: var(--font-serif);
    font-size: 1.3rem;
    font-weight: 700;
    margin-bottom: 14px;
    color: var(--ink-strong);
    letter-spacing: -0.01em;
  }
  .rules {
    display: grid;
    gap: 12px;
    margin-bottom: 28px;
    font-size: 0.86rem;
    line-height: 1.55;
    color: var(--mute);
  }
  .rules .row {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 12px 14px;
    background: var(--panel-soft);
    border: 1px solid var(--line);
    border-radius: 14px;
  }
  .rules .pill {
    flex-shrink: 0;
    font-size: 0.65rem;
    font-weight: 800;
    padding: 3px 8px;
    border-radius: 6px;
    letter-spacing: 0.08em;
    margin-top: 1px;
    font-family: var(--font-mono);
  }
  .rules .pill.dr { background: var(--dr-soft); color: var(--dr); border: 1px solid var(--dr-line); }
  .rules .pill.cr { background: var(--cr-soft); color: #5a6f49; border: 1px solid var(--cr-line); }

  .category-filter {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 28px;
  }
  .cat-chip {
    font-family: inherit;
    font-size: 0.78rem;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--mute);
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .cat-chip:hover { border-color: var(--gold-line); color: var(--ink-strong); }
  .cat-chip.active {
    background: var(--gold-soft);
    border-color: var(--gold-line);
    color: var(--ink-strong);
  }

  .btn {
    font-family: inherit;
    font-weight: 800;
    font-size: 0.95rem;
    padding: 14px 28px;
    border-radius: 999px;
    border: 1px solid var(--line-strong);
    cursor: pointer;
    transition: all 0.18s ease;
    letter-spacing: 0.02em;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .btn-primary {
    background: #d1d5db;
    color: var(--ink-strong);
    width: 100%;
    justify-content: center;
    box-shadow: 0 8px 24px rgba(15,23,42,0.08);
  }
  .btn-primary:hover {
    transform: translateY(-1px);
    box-shadow: 0 12px 28px rgba(15,23,42,0.12);
    background: #c8ccd2;
  }
  .btn-ghost {
    background: var(--panel-soft);
    color: var(--ink);
    border: 1px solid var(--line);
  }
  .btn-ghost:hover { background: var(--panel); border-color: var(--line-strong); }

  /* ─── Quiz screen ────────────────────────────────────────── */
  .meta-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    font-size: 0.78rem;
    color: var(--faint);
    letter-spacing: 0.04em;
    font-weight: 600;
  }
  .score-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 12px;
    border-radius: 999px;
    background: var(--cr-soft);
    border: 1px solid var(--cr-line);
    color: #5a6f49;
    font-weight: 700;
  }
  .streak-pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 4px 12px;
    border-radius: 999px;
    background: var(--gold-soft);
    border: 1px solid var(--gold-line);
    color: #7a6c4e;
    font-weight: 700;
    margin-left: 8px;
  }

  .progress-bar {
    height: 4px;
    background: rgba(17,24,39,0.08);
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 22px;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--dr) 0%, var(--cr) 100%);
    transition: width 0.35s ease;
  }

  .qcard {
    background: linear-gradient(180deg, rgba(255,255,255,0.97), rgba(247,248,250,0.97));
    border: 1px solid var(--line);
    border-radius: 22px;
    padding: 30px 26px;
    box-shadow: var(--shadow-md);
    animation: fadeIn 0.35s ease-out;
  }
  .cat-tag {
    display: inline-block;
    padding: 4px 12px;
    background: var(--panel-soft);
    border: 1px solid var(--line);
    border-radius: 999px;
    font-size: 0.65rem;
    font-weight: 800;
    letter-spacing: 0.16em;
    color: var(--faint);
    margin-bottom: 18px;
    text-transform: uppercase;
  }
  .question-text {
    font-family: var(--font-serif);
    font-size: 1.25rem;
    font-weight: 600;
    line-height: 1.45;
    letter-spacing: -0.01em;
    margin-bottom: 24px;
    color: var(--ink-strong);
  }

  .options { display: flex; flex-direction: column; gap: 10px; }
  .option {
    display: flex;
    align-items: center;
    width: 100%;
    padding: 14px 16px;
    background: var(--panel-soft);
    border: 1.5px solid var(--line);
    border-radius: 14px;
    color: var(--ink-strong);
    font-family: inherit;
    font-size: 0.92rem;
    line-height: 1.5;
    text-align: left;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .option:hover:not(:disabled) {
    border-color: var(--gold-line);
    background: var(--gold-soft);
    transform: translateX(2px);
  }
  .option:disabled { cursor: default; }
  .option.correct {
    background: var(--cr-soft);
    border-color: var(--cr-line);
    color: #3f4f33;
  }
  .option.wrong {
    background: var(--bad-soft);
    border-color: var(--bad-line);
    color: #7a3f37;
    animation: shake 0.35s ease-out;
  }
  .option.dimmed { opacity: 0.45; }
  .option-letter {
    flex-shrink: 0;
    width: 28px;
    height: 28px;
    line-height: 26px;
    text-align: center;
    border: 1px solid var(--line-strong);
    border-radius: 50%;
    margin-right: 14px;
    font-weight: 800;
    font-size: 0.74rem;
    font-family: var(--font-mono);
    color: var(--mute);
    background: var(--panel);
  }
  .option.correct .option-letter { border-color: var(--cr-line); background: rgba(140,159,116,0.32); color: #3f4f33; }
  .option.wrong .option-letter   { border-color: var(--bad-line); background: rgba(216,180,174,0.4); color: #7a3f37; }

  /* ─── Feedback panel ─────────────────────────────────────── */
  .feedback {
    margin-top: 22px;
    padding: 18px 20px;
    border-radius: 14px;
    background: var(--panel-soft);
    border: 1px solid var(--line);
    border-left: 3px solid var(--cr);
    animation: fadeIn 0.35s ease-out;
  }
  .feedback.wrong { border-left-color: var(--bad); }
  .feedback-title {
    font-size: 0.85rem;
    font-weight: 800;
    margin-bottom: 8px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .feedback-title.ok   { color: #5a6f49; }
  .feedback-title.bad  { color: #7a3f37; }
  .feedback-body {
    font-size: 0.88rem;
    line-height: 1.6;
    color: var(--mute);
  }

  /* T-account visualization */
  .t-acct {
    margin-top: 16px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
    font-size: 0.82rem;
    background: var(--panel);
    font-family: var(--font-mono);
  }
  .t-head {
    padding: 8px 12px;
    font-weight: 800;
    text-align: center;
    letter-spacing: 0.16em;
    font-size: 0.66rem;
    background: var(--panel-soft);
    text-transform: uppercase;
    font-family: var(--font-sans);
  }
  .t-head.dr { color: var(--dr); border-right: 1px solid var(--line); }
  .t-head.cr { color: #5a6f49; }
  .t-cell {
    padding: 10px 12px;
    min-height: 42px;
    display: flex;
    justify-content: space-between;
    gap: 12px;
  }
  .t-cell.dr { border-right: 1px solid var(--line); color: var(--ink-strong); }
  .t-cell.cr { color: var(--ink-strong); }
  .t-cell .amt { color: var(--faint); font-variant-numeric: tabular-nums; font-weight: 700; }

  .next-btn-row {
    margin-top: 20px;
    display: flex;
    justify-content: flex-end;
    gap: 10px;
  }
  .next-btn {
    background: var(--gold-soft);
    color: var(--ink-strong);
    font-weight: 800;
    border: 1px solid var(--gold-line);
    animation: goldPulse 2.6s ease-in-out infinite;
  }
  .next-btn:hover { background: rgba(196,178,143,0.36); }

  /* ─── Results screen ─────────────────────────────────────── */
  .results {
    text-align: center;
    padding: 8px 4px;
    animation: fadeIn 0.5s ease-out;
  }
  .score-big {
    font-family: var(--font-serif);
    font-size: 4.8rem;
    font-weight: 700;
    line-height: 1;
    letter-spacing: -0.05em;
    color: var(--ink-strong);
    margin-bottom: 10px;
  }
  .score-pct {
    color: var(--faint);
    font-size: 0.75rem;
    margin-bottom: 8px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    font-weight: 600;
  }
  .score-msg {
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--ink-strong);
    margin-bottom: 28px;
    font-family: var(--font-serif);
  }
  .review-title {
    font-size: 0.7rem;
    color: var(--faint);
    letter-spacing: 0.18em;
    text-align: left;
    margin: 24px 0 12px;
    text-transform: uppercase;
    font-weight: 700;
  }
  .review-item {
    text-align: left;
    padding: 16px 18px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-left: 3px solid var(--bad);
    border-radius: 14px;
    margin-bottom: 10px;
    font-size: 0.86rem;
    line-height: 1.55;
    box-shadow: var(--shadow-sm);
  }
  .review-item .q {
    color: var(--ink-strong);
    margin-bottom: 8px;
    font-weight: 600;
    font-family: var(--font-serif);
    font-size: 0.95rem;
  }
  .review-item .yours { color: #7a3f37; font-size: 0.8rem; }
  .review-item .correct-text { color: #5a6f49; font-size: 0.8rem; margin-top: 2px; font-weight: 600; }

  .action-row { display: flex; gap: 10px; margin-top: 28px; }
  .action-row .btn { flex: 1; }

  .kbd {
    display: inline-block;
    padding: 1px 7px;
    font-size: 0.7rem;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--panel);
    color: var(--mute);
    margin: 0 1px;
    font-family: var(--font-mono);
  }

  /* ─── Top bar (sync + settings) ───────────────────────────── */
  .topbar {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 8px;
    margin-bottom: 16px;
  }
  .sync-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 12px;
    border-radius: 999px;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--mute);
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.04em;
  }
  .sync-pill.local   { color: var(--faint); }
  .sync-pill.saving  { color: #7a6c4e; background: var(--gold-soft); border-color: var(--gold-line); }
  .sync-pill.synced  { color: #5a6f49; background: var(--cr-soft); border-color: var(--cr-line); }
  .sync-pill.error   { color: #7a3f37; background: var(--bad-soft); border-color: var(--bad-line); }
  .sync-pill .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: currentColor; opacity: 0.65;
  }
  .gear-btn {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 5px 12px;
    cursor: pointer;
    color: var(--mute);
    font-family: inherit;
    font-size: 0.78rem;
    font-weight: 600;
    transition: all 0.15s ease;
  }
  .gear-btn:hover { border-color: var(--line-strong); color: var(--ink-strong); }

  /* ─── Practice-weakest secondary action ─────────────────── */
  .secondary-action-row {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 12px;
  }
  .btn-weak {
    background: var(--panel);
    color: var(--ink-strong);
    border: 1px solid var(--line-strong);
    width: 100%;
    justify-content: space-between;
    text-align: left;
    padding: 14px 18px;
  }
  .btn-weak:hover {
    background: var(--gold-soft);
    border-color: var(--gold-line);
  }
  .btn-weak[disabled] {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .btn-weak[disabled]:hover {
    background: var(--panel);
    border-color: var(--line-strong);
  }
  .btn-weak .meta {
    font-size: 0.72rem;
    color: var(--faint);
    font-weight: 600;
    letter-spacing: 0.04em;
  }
  .btn-weak .label {
    display: flex;
    flex-direction: column;
    gap: 2px;
    align-items: flex-start;
  }
  .btn-weak .arrow { color: var(--faint); font-size: 1.1rem; }

  /* ─── Settings modal ──────────────────────────────────────── */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(15,23,42,0.45);
    backdrop-filter: blur(4px);
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    animation: fadeIn 0.2s ease-out;
  }
  .modal {
    width: 100%;
    max-width: 460px;
    background: linear-gradient(180deg, rgba(255,255,255,0.98), rgba(247,248,250,0.98));
    border: 1px solid var(--line);
    border-radius: 22px;
    padding: 28px 26px;
    box-shadow: var(--shadow-md);
    animation: pageLift 0.3s ease-out;
  }
  .modal h2 {
    font-family: var(--font-serif);
    font-size: 1.4rem;
    font-weight: 700;
    margin-bottom: 6px;
    color: var(--ink-strong);
    letter-spacing: -0.01em;
  }
  .modal .modal-sub {
    font-size: 0.8rem;
    color: var(--faint);
    margin-bottom: 22px;
  }
  .modal-section {
    margin-bottom: 20px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--line);
  }
  .modal-section:last-child {
    border-bottom: none;
    margin-bottom: 0;
    padding-bottom: 0;
  }
  .modal-label {
    display: block;
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--faint);
    margin-bottom: 8px;
  }
  .modal-help {
    font-size: 0.78rem;
    line-height: 1.55;
    color: var(--mute);
    margin-bottom: 10px;
  }
  .modal-help a { color: var(--ink-strong); text-decoration: underline; }
  .modal input[type="text"],
  .modal input[type="password"] {
    width: 100%;
    padding: 11px 14px;
    border-radius: 12px;
    border: 1.5px solid var(--line);
    background: var(--panel);
    font-family: var(--font-mono);
    font-size: 0.85rem;
    color: var(--ink-strong);
    outline: none;
    transition: border-color 0.15s ease;
  }
  .modal input[type="text"]:focus,
  .modal input[type="password"]:focus {
    border-color: var(--line-strong);
  }
  .modal-row {
    display: flex;
    gap: 8px;
    margin-top: 10px;
    flex-wrap: wrap;
  }
  .modal-row .btn { flex: 1; padding: 11px 16px; font-size: 0.85rem; min-width: 110px; }
  .modal-info {
    font-size: 0.74rem;
    color: var(--faint);
    margin-top: 8px;
    font-family: var(--font-mono);
  }
  .modal-close-row {
    display: flex;
    justify-content: flex-end;
    margin-top: 24px;
  }
  .danger-btn {
    background: var(--bad-soft);
    border: 1px solid var(--bad-line);
    color: #7a3f37;
  }
  .danger-btn:hover { background: rgba(216,180,174,0.4); }

  @media (max-width: 600px) {
    .hero h1 { font-size: 2.2rem; }
    .score-big { font-size: 3.6rem; }
    .qcard, .start-card { padding: 24px 20px; border-radius: 18px; }
    .container { padding: 32px 14px 60px; }
    .question-text { font-size: 1.1rem; }
    .modal { padding: 22px 18px; border-radius: 18px; }
  }
</style>
</head>
<body>
<div class="container" id="app"></div>

<script>
// ═══════════════════════════════════════════════════════════════════════════
// QUESTION BANK
// ═══════════════════════════════════════════════════════════════════════════
// Each question has:
//   category, prompt, options[], correct (index into options),
//   explanation (why), entry ({ debits:[[acct,amt]], credits:[[acct,amt]] })
//
const QUESTIONS = [
  // ── Revenue ──────────────────────────────────────────────────────────
  {
    category: "Revenue",

// QUESTION IDS — stable across reorderings/insertions, derived from prompt
// ═══════════════════════════════════════════════════════════════════════════
function hashId(s) {
  let h = 5381;
  for (let i = 0; i < s.length; i++) h = ((h << 5) + h) + s.charCodeAt(i);
  return "q" + (h >>> 0).toString(36);
}
QUESTIONS.forEach(q => { q.id = hashId(q.prompt); });

// ═══════════════════════════════════════════════════════════════════════════
// PERSISTENCE — local storage + optional GitHub Gist sync
// ═══════════════════════════════════════════════════════════════════════════
const GIST_FILENAME  = "journal-quiz-data.json";
const PAT_KEY        = "journal-quiz-pat";
const GIST_ID_KEY    = "journal-quiz-gist-id";
const LOCAL_DATA_KEY = "journal-quiz-data";

const DEFAULT_DATA = {
  questionStats: {},   // { id: { attempts, correct, lastWrong, lastSeen } }
  totalSessions: 0,
  lastUpdated: 0,
};

function getPat()   { return localStorage.getItem(PAT_KEY) || ""; }
function setPat(t)  { if (t) localStorage.setItem(PAT_KEY, t); else localStorage.removeItem(PAT_KEY); }
function getGistId(){ return localStorage.getItem(GIST_ID_KEY) || ""; }
function setGistId(id){ if (id) localStorage.setItem(GIST_ID_KEY, id); else localStorage.removeItem(GIST_ID_KEY); }

function loadLocalData() {
  try {
    const raw = localStorage.getItem(LOCAL_DATA_KEY);
    if (!raw) return { ...DEFAULT_DATA };
    return { ...DEFAULT_DATA, ...JSON.parse(raw) };
  } catch { return { ...DEFAULT_DATA }; }
}
function saveLocalData(data) {
  try { localStorage.setItem(LOCAL_DATA_KEY, JSON.stringify(data)); } catch {}
}

async function gistFetch(path, opts = {}) {
  const pat = getPat();
  if (!pat) throw new Error("No PAT configured");
  const r = await fetch(`https://api.github.com${path}`, {
    ...opts,
    headers: { Authorization: `token ${pat}`, Accept: "application/vnd.github+json", ...(opts.headers || {}) },
  });
  if (!r.ok) throw new Error(`GitHub API ${r.status}: ${r.statusText}`);
  return r.json();
}

async function loadGistData() {
  const gistId = getGistId();
  if (!gistId) return null;
  const gist = await gistFetch(`/gists/${gistId}`);
  const file = gist.files && gist.files[GIST_FILENAME];
  if (!file) return null;
  try { return { ...DEFAULT_DATA, ...JSON.parse(file.content) }; }
  catch { return null; }
}

let _gistSaveInFlight = null;
let _gistSavePending = null;

async function _drainGistSave() {
  try {
    while (_gistSavePending) {
      const data = _gistSavePending;
      _gistSavePending = null;
      await saveGistData(data);
    }
    setSyncStatus("synced");
  } catch (e) {
    console.warn("Gist save failed:", e);
    setSyncStatus("error");
  } finally {
    _gistSaveInFlight = null;
  }
}

function queueGistSave(data) {
  saveLocalData(data);
  if (!getPat()) { setSyncStatus("local"); return; }
  _gistSavePending = data;
  setSyncStatus("saving");
  if (!_gistSaveInFlight) _gistSaveInFlight = _drainGistSave();
}

async function saveGistData(data) {
  const gistId = getGistId();
  const body = { files: { [GIST_FILENAME]: { content: JSON.stringify(data, null, 2) } } };
  if (gistId) {
    return gistFetch(`/gists/${gistId}`, { method: "PATCH", body: JSON.stringify(body) });
  } else {
    const gist = await gistFetch("/gists", {
      method: "POST",
      body: JSON.stringify({ description: "Journal Entry Trainer — saved progress", public: false, ...body }),
    });
    setGistId(gist.id);
    return gist;
  }
}

// Merge two data snapshots: take whichever has more attempts per question.
function mergeData(a, b) {
  const out = { ...DEFAULT_DATA, ...a };
  out.questionStats = { ...(a.questionStats || {}) };
  for (const [id, sb] of Object.entries(b.questionStats || {})) {
    const sa = out.questionStats[id];
    if (!sa || (sb.attempts || 0) > (sa.attempts || 0)) {
      out.questionStats[id] = sb;
    }
  }
  out.totalSessions = Math.max(a.totalSessions || 0, b.totalSessions || 0);
  out.lastUpdated   = Math.max(a.lastUpdated   || 0, b.lastUpdated   || 0);
  return out;
}

// ═══════════════════════════════════════════════════════════════════════════
// STATS HELPERS
// ═══════════════════════════════════════════════════════════════════════════
function recordAnswer(q, isCorrect) {
  const id = q.id;
  const s = state.data.questionStats[id] || { attempts: 0, correct: 0, lastWrong: 0, lastSeen: 0 };
  s.attempts++;
  if (isCorrect) s.correct++;
  else s.lastWrong = Date.now();
  s.lastSeen = Date.now();
  state.data.questionStats[id] = s;
  state.data.lastUpdated = Date.now();
}

function weaknessScore(q) {
  const s = state.data.questionStats[q.id];
  if (!s || !s.attempts) return -1; // never seen → handled separately
  const errorRate = (s.attempts - s.correct) / s.attempts;
  // Recency: a recent wrong answer matters more (decay over ~14 days)
  const ageDays = s.lastWrong ? (Date.now() - s.lastWrong) / 86400000 : 999;
  const recency = Math.exp(-ageDays / 14);
  return errorRate * (0.5 + 0.5 * recency);
}

function getWeakestPool(limit = 15) {
  const seen = QUESTIONS
    .map((q, i) => ({ i, q, score: weaknessScore(q), stats: state.data.questionStats[q.id] }))
    .filter(x => x.stats && x.stats.attempts > 0);
  // Highest weakness first; tiebreaker: fewer attempts (less data → review)
  seen.sort((a, b) => b.score - a.score || (a.stats.attempts - b.stats.attempts));
  let result = seen.filter(x => x.score > 0).slice(0, limit).map(x => x.i);
  // If still short, fill with unseen questions
  if (result.length < limit) {
    const unseen = QUESTIONS
      .map((q, i) => ({ i, stats: state.data.questionStats[q.id] }))
      .filter(x => !x.stats || !x.stats.attempts);
    for (const u of unseen) {
      if (result.length >= limit) break;
      result.push(u.i);
    }
  }
  return result;
}

function totalAttempts() {
  return Object.values(state.data.questionStats).reduce((a, s) => a + (s.attempts || 0), 0);
}
function totalQuestionsSeen() {
  return Object.values(state.data.questionStats).filter(s => s && s.attempts > 0).length;
}

// STATE
// ═══════════════════════════════════════════════════════════════════════════
const state = {
  screen: "start",           // "start" | "quiz" | "results"
  selectedCats: new Set(),   // empty = all
  order: [],                 // indices into QUESTIONS for this run
  idx: 0,
  score: 0,
  streak: 0,
  bestStreak: 0,
  answered: false,
  picked: -1,                // index into shuffled options
  optionOrder: [],           // mapping: display_index → original_option_index
  wrong: [],                 // [{q, picked, correctText}]
  mode: "all",               // "all" | "weak" — what the current run is drawn from
  data: loadLocalData(),     // persisted progress (questionStats, etc.)
  syncStatus: getPat() ? "connected" : "local",
  settingsOpen: false,
};

const ALL_CATS = [...new Set(QUESTIONS.map(q => q.category))];

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ═══════════════════════════════════════════════════════════════════════════
// RENDERERS
// ═══════════════════════════════════════════════════════════════════════════
const app = document.getElementById("app");

function render() {
  if (state.screen === "start")   return renderStart();
  if (state.screen === "quiz")    return renderQuiz();
  if (state.screen === "results") return renderResults();
}

function renderStart() {
  const total = QUESTIONS.length;
  const selected = state.selectedCats.size === 0 ? total
    : QUESTIONS.filter(q => state.selectedCats.has(q.category)).length;
  const weakPool = getWeakestPool(15);
  const weakCount = weakPool.length;
  const seenCount = totalQuestionsSeen();
  const hasStats = seenCount > 0;

  app.innerHTML = `
    <div class="topbar">
      <span class="sync-pill ${state.syncStatus}" id="syncPill"><span class="dot"></span>${escapeHtml(syncStatusLabel(state.syncStatus))}</span>
      <button class="gear-btn" id="settingsBtn" title="Sync &amp; reset">⚙ Settings</button>
    </div>
    <div class="hero">
      <h1>Journal Entry Trainer</h1>
      <div class="sub">Debit the receiver · credit the giver</div>
    </div>
    <div class="start-card">
      <h2>How to play</h2>
      <div class="rules">
        <div class="row"><span class="pill dr">DR</span><div>Debits are on the <b>left</b> — they increase assets and expenses, decrease liabilities, equity, and revenue.</div></div>
        <div class="row"><span class="pill cr">CR</span><div>Credits are on the <b>right</b> — they do the opposite.</div></div>
        <div class="row"><span class="pill" style="background:var(--gold-soft);color:#7a6c4e;border:1px solid var(--gold-line);">?</span><div>Pick the entry that records the transaction. Immediate feedback explains each answer.</div></div>
      </div>
      <h2>Focus on topics <span style="font-weight:400;color:var(--faint);font-size:0.78rem;font-family:var(--font-sans);">(optional · leave blank for all)</span></h2>
      <div class="category-filter" id="catFilter">
        ${ALL_CATS.map(c =>
          `<button class="cat-chip ${state.selectedCats.has(c) ? "active" : ""}" data-cat="${c}">${c} (${QUESTIONS.filter(q=>q.category===c).length})</button>`
        ).join("")}
      </div>
      <button class="btn btn-primary" id="startBtn">
        Start Quiz · ${selected} question${selected !== 1 ? "s" : ""}
      </button>
      <div class="secondary-action-row">
        <button class="btn btn-weak" id="weakBtn" ${hasStats ? "" : "disabled"}>
          <span class="label">
            <span>Practice your weakest ${weakCount || 0}</span>
            <span class="meta">${hasStats
              ? `Drawn from ${seenCount} attempted · ${totalAttempts()} total answers`
              : "Answer some questions first to build a weakness profile"}</span>
          </span>
          <span class="arrow">→</span>
        </button>
      </div>
      <div style="text-align:center;margin-top:18px;color:var(--faint);font-size:0.72rem;letter-spacing:0.04em;">
        Keyboard: <span class="kbd">A</span><span class="kbd">B</span><span class="kbd">C</span><span class="kbd">D</span> to answer · <span class="kbd">Enter</span> / <span class="kbd">Space</span> for next
      </div>
    </div>
    ${state.settingsOpen ? renderSettingsModal() : ""}
  `;
  document.querySelectorAll("#catFilter .cat-chip").forEach(b => {
    b.addEventListener("click", () => {
      const c = b.dataset.cat;
      if (state.selectedCats.has(c)) state.selectedCats.delete(c);
      else state.selectedCats.add(c);
      render();
    });
  });
  document.getElementById("startBtn").addEventListener("click", () => startQuiz());
  document.getElementById("weakBtn").addEventListener("click", () => {
    if (!hasStats) return;
    startWeakQuiz();
  });
  document.getElementById("settingsBtn").addEventListener("click", () => {
    state.settingsOpen = true;
    render();
  });
  if (state.settingsOpen) wireSettingsModal();
}

function syncStatusLabel(s) {
  if (s === "synced")    return "Synced";
  if (s === "saving")    return "Saving…";
  if (s === "error")     return "Sync error";
  if (s === "connected") return "Connected";
  return "Local only";
}

function setSyncStatus(s) {
  state.syncStatus = s;
  const el = document.getElementById("syncPill");
  if (el) {
    el.className = "sync-pill " + s;
    el.innerHTML = `<span class="dot"></span>${escapeHtml(syncStatusLabel(s))}`;
  }
}

function renderSettingsModal() {
  const pat = getPat();
  const gistId = getGistId();
  const seen = totalQuestionsSeen();
  const attempts = totalAttempts();
  return `
    <div class="modal-backdrop" id="settingsBackdrop">
      <div class="modal" id="settingsModal">
        <h2>Settings</h2>
        <div class="modal-sub">Cloud sync, progress, and reset.</div>

        <div class="modal-section">
          <span class="modal-label">Cloud sync (optional)</span>
          <p class="modal-help">
            Save your progress to a private GitHub Gist so you can resume on any device.
            Create a token with <b>gist</b> scope at
            <a href="https://github.com/settings/tokens?type=beta" target="_blank" rel="noopener">github.com/settings/tokens</a>
            and paste it below.
          </p>
          <input type="password" id="patInput" placeholder="ghp_… (Personal Access Token)" value="${escapeHtml(pat)}" autocomplete="off" spellcheck="false">
          <div class="modal-row">
            <button class="btn btn-primary" id="savePatBtn">Save &amp; sync</button>
            ${pat ? `<button class="btn btn-ghost" id="disconnectBtn">Disconnect</button>` : ""}
          </div>
          ${gistId ? `<div class="modal-info">Gist: ${escapeHtml(gistId.slice(0, 12))}…</div>` : ""}
        </div>

        <div class="modal-section">
          <span class="modal-label">Local progress</span>
          <p class="modal-help">${seen} question${seen===1?"":"s"} attempted · ${attempts} total answer${attempts===1?"":"s"} recorded.</p>
          <div class="modal-row">
            <button class="btn danger-btn" id="resetBtn">Reset all progress</button>
          </div>
        </div>

        <div class="modal-close-row">
          <button class="btn btn-ghost" id="closeSettingsBtn">Close</button>
        </div>
      </div>
    </div>
  `;
}

function wireSettingsModal() {
  document.getElementById("settingsBackdrop").addEventListener("click", (e) => {
    if (e.target.id === "settingsBackdrop") {
      state.settingsOpen = false;
      render();
    }
  });
  document.getElementById("closeSettingsBtn").addEventListener("click", () => {
    state.settingsOpen = false;
    render();
  });
  document.getElementById("savePatBtn").addEventListener("click", async () => {
    const v = document.getElementById("patInput").value.trim();
    if (!v) return;
    setPat(v);
    setSyncStatus("saving");
    try {
      // Try to load any existing gist; merge with local data
      const remote = await loadGistData();
      if (remote) state.data = mergeData(state.data, remote);
      state.data.lastUpdated = Date.now();
      // Save merged result back
      await saveGistData(state.data);
      saveLocalData(state.data);
      setSyncStatus("synced");
    } catch (e) {
      console.warn(e);
      setSyncStatus("error");
    }
    state.settingsOpen = false;
    render();
  });
  const disc = document.getElementById("disconnectBtn");
  if (disc) disc.addEventListener("click", () => {
    setPat("");
    setGistId("");
    setSyncStatus("local");
    state.settingsOpen = false;
    render();
  });
  document.getElementById("resetBtn").addEventListener("click", () => {
    if (!confirm("Reset all local progress? This cannot be undone.")) return;
    state.data = { ...DEFAULT_DATA, lastUpdated: Date.now() };
    queueGistSave(state.data);
    state.settingsOpen = false;
    render();
  });
}

function startWeakQuiz() {
  const pool = getWeakestPool(15);
  if (!pool.length) return;
  state.mode = "weak";
  state.order = shuffle(pool);
  state.idx = 0;
  state.score = 0;
  state.streak = 0;
  state.bestStreak = 0;
  state.wrong = [];
  state.screen = "quiz";
  loadCurrent();
  render();
}

function startQuiz() {
  const pool = state.selectedCats.size === 0
    ? QUESTIONS.map((_, i) => i)
    : QUESTIONS.map((q, i) => state.selectedCats.has(q.category) ? i : -1).filter(i => i >= 0);
  if (!pool.length) return;
  state.mode = "all";
  state.order = shuffle(pool);
  state.idx = 0;
  state.score = 0;
  state.streak = 0;
  state.bestStreak = 0;
  state.wrong = [];
  state.screen = "quiz";
  loadCurrent();
  render();
}

function loadCurrent() {
  state.answered = false;
  state.picked = -1;
  const q = QUESTIONS[state.order[state.idx]];
  state.optionOrder = shuffle(q.options.map((_, i) => i));
}

function renderQuiz() {
  const q = QUESTIONS[state.order[state.idx]];
  const total = state.order.length;
  const pct = Math.round((state.idx / total) * 100);

  app.innerHTML = `
    <div class="meta-row">
      <div>Question ${state.idx + 1} of ${total}</div>
      <div>
        <span class="score-pill">✓ ${state.score}</span>
        ${state.streak > 1 ? `<span class="streak-pill">🔥 ${state.streak}</span>` : ""}
      </div>
    </div>
    <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="qcard">
      <div class="cat-tag">${q.category}</div>
      <div class="question-text">${escapeHtml(q.prompt)}</div>
      <div class="options" id="options">
        ${state.optionOrder.map((origIdx, displayIdx) => {
          const letter = "ABCD"[displayIdx];
          return `<button class="option" data-i="${displayIdx}">
            <span class="option-letter">${letter}</span>
            <span>${escapeHtml(q.options[origIdx])}</span>
          </button>`;
        }).join("")}
      </div>
      <div id="feedbackSlot"></div>
    </div>
  `;

  document.querySelectorAll("#options .option").forEach(b => {
    b.addEventListener("click", () => pickAnswer(parseInt(b.dataset.i, 10)));
  });
}

function pickAnswer(displayIdx) {
  if (state.answered) return;
  state.answered = true;
  state.picked = displayIdx;
  const q = QUESTIONS[state.order[state.idx]];
  const pickedOriginal = state.optionOrder[displayIdx];
  const correctDisplay = state.optionOrder.indexOf(q.correct);
  const isCorrect = pickedOriginal === q.correct;

  if (isCorrect) {
    state.score++;
    state.streak++;
    state.bestStreak = Math.max(state.bestStreak, state.streak);
  } else {
    state.streak = 0;
    state.wrong.push({
      prompt: q.prompt,
      picked: q.options[pickedOriginal],
      correct: q.options[q.correct],
      explanation: q.explanation,
    });
  }

  recordAnswer(q, isCorrect);
  queueGistSave(state.data);

  // Highlight options
  document.querySelectorAll("#options .option").forEach((btn, i) => {
    btn.disabled = true;
    if (i === correctDisplay) btn.classList.add("correct");
    else if (i === displayIdx) btn.classList.add("wrong");
    else btn.classList.add("dimmed");
  });

  // Render feedback
  const slot = document.getElementById("feedbackSlot");
  slot.innerHTML = `
    <div class="feedback ${isCorrect ? "" : "wrong"}">
      <div class="feedback-title ${isCorrect ? "ok" : "bad"}">
        ${isCorrect ? "✓ Correct" : "✗ Not quite"}
      </div>
      <div class="feedback-body">${escapeHtml(q.explanation)}</div>
      ${renderTAccount(q.entry)}
    </div>
    <div class="next-btn-row">
      <button class="btn next-btn" id="nextBtn">
        ${state.idx + 1 < state.order.length ? "Next →" : "See results"}
      </button>
    </div>
  `;
  document.getElementById("nextBtn").addEventListener("click", next);
}

function renderTAccount(entry) {
  if (!entry) return "";
  const rows = Math.max(entry.debits.length, entry.credits.length);
  let cells = "";
  for (let i = 0; i < rows; i++) {
    const d = entry.debits[i];
    const c = entry.credits[i];
    cells += `
      <div class="t-cell dr">${d ? `<span>${escapeHtml(d[0])}</span><span class="amt">${escapeHtml(d[1] || "")}</span>` : ""}</div>
      <div class="t-cell cr">${c ? `<span style="padding-left:14px;">${escapeHtml(c[0])}</span><span class="amt">${escapeHtml(c[1] || "")}</span>` : ""}</div>
    `;
  }
  return `
    <div class="t-acct">
      <div class="t-head dr">DEBIT</div>
      <div class="t-head cr">CREDIT</div>
      ${cells}
    </div>
  `;
}

function next() {
  if (state.idx + 1 < state.order.length) {
    state.idx++;
    loadCurrent();
    render();
  } else {
    state.screen = "results";
    render();
  }
}

function renderResults() {
  const total = state.order.length;
  const pct = Math.round((state.score / total) * 100);
  let msg = "Back to the books 📚";
  if (pct === 100) msg = "Perfect. Auditor-grade. 🏆";
  else if (pct >= 90) msg = "Excellent — you know the ledgers cold.";
  else if (pct >= 75) msg = "Strong result.";
  else if (pct >= 60) msg = "Solid foundation — review the misses below.";
  else if (pct >= 40) msg = "Keep practicing — focus on debit/credit rules.";

  const modeTag = state.mode === "weak" ? "Weakest practice" : "Mixed practice";

  app.innerHTML = `
    <div class="results">
      <div class="cat-tag" style="margin-bottom:14px;">${escapeHtml(modeTag)}</div>
      <div class="score-big">${state.score} / ${total}</div>
      <div class="score-pct">${pct}% correct · best streak ${state.bestStreak}</div>
      <div class="score-msg">${msg}</div>

      ${state.wrong.length ? `
        <div class="review-title">Review · ${state.wrong.length} to re-learn</div>
        ${state.wrong.map(w => `
          <div class="review-item">
            <div class="q">${escapeHtml(w.prompt)}</div>
            <div class="yours">Your answer: ${escapeHtml(w.picked)}</div>
            <div class="correct-text">Correct: ${escapeHtml(w.correct)}</div>
            <div class="feedback-body" style="margin-top:8px;font-size:0.78rem;">${escapeHtml(w.explanation)}</div>
          </div>
        `).join("")}
      ` : ""}

      <div class="action-row">
        <button class="btn btn-ghost" id="homeBtn">← Home</button>
        <button class="btn btn-primary" id="againBtn">${state.mode === "weak" ? "Practice weak again" : "Play again"}</button>
      </div>
    </div>
  `;
  document.getElementById("homeBtn").addEventListener("click", () => {
    state.screen = "start";
    render();
  });
  document.getElementById("againBtn").addEventListener("click", () => {
    if (state.mode === "weak") startWeakQuiz();
    else startQuiz();
  });
}

function escapeHtml(s) {
  return String(s ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

// ═══════════════════════════════════════════════════════════════════════════
// KEYBOARD
// ═══════════════════════════════════════════════════════════════════════════
document.addEventListener("keydown", (e) => {
  // Settings modal takes priority — only handle Escape, leave inputs alone.
  if (state.settingsOpen) {
    if (e.key === "Escape") {
      state.settingsOpen = false;
      render();
      e.preventDefault();
    }
    return;
  }
  // Don't hijack typing inside any text input/textarea.
  const tag = (e.target && e.target.tagName) || "";
  if (tag === "INPUT" || tag === "TEXTAREA") return;

  if (state.screen === "quiz") {
    if (!state.answered) {
      const key = e.key.toUpperCase();
      const idx = "ABCD".indexOf(key);
      if (idx >= 0 && idx < state.optionOrder.length) {
        pickAnswer(idx);
        e.preventDefault();
      }
      const num = parseInt(e.key, 10);
      if (!isNaN(num) && num >= 1 && num <= 4 && num - 1 < state.optionOrder.length) {
        pickAnswer(num - 1);
        e.preventDefault();
      }
    } else if (e.key === "Enter" || e.key === " ") {
      next();
      e.preventDefault();
    }
  } else if (state.screen === "start" && e.key === "Enter") {
    startQuiz();
    e.preventDefault();
  } else if (state.screen === "results" && e.key === "Enter") {
    if (state.mode === "weak") startWeakQuiz();
    else startQuiz();
    e.preventDefault();
  }
});

// ═══════════════════════════════════════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════════════════════════════════════
render();

// If a PAT is configured, pull the gist on load so the latest cross-device
// progress wins. Merge with local in case the local copy has newer answers
// recorded while offline.
if (getPat()) {
  setSyncStatus("saving");
  loadGistData()
    .then(remote => {
      if (remote) {
        state.data = mergeData(state.data, remote);
        saveLocalData(state.data);
        if (state.screen === "start") render();
      }
      setSyncStatus("synced");
    })
    .catch(e => {
      console.warn("Initial gist load failed:", e);
      setSyncStatus("error");
    });
}
</script>
