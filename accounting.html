<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Journal Entry Trainer — Accounting Quiz</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="container" id="app"></div>

<div id="ponyReward" class="pony-reward" aria-hidden="true" role="status">
  <img id="ponyImg" alt="A cute pony" />
  <div class="pony-caption">✨ Cute pony!</div>
  <button type="button" class="pony-close" id="ponyClose" aria-label="Dismiss">×</button>
</div>

<!-- Load order matters: shared globals first, then renderers (which need them),
     then keyboard (which references render/state at call time), then main
     (boot loader that fetches JSON data and triggers the first render). -->
<script src="js/audio.js"></script>
<script src="js/ponies.js"></script>
<script src="js/question-bank.js"></script>
<script src="js/persistence.js"></script>
<script src="js/stats.js"></script>
<script src="js/state.js"></script>
<script src="js/renderers.js"></script>
<script src="js/keyboard.js"></script>
<script src="js/main.js"></script>
</body>
</html>
